server:
  port: 8088

grpc:
  server:
    port: 9098

spring:
  application:
    name: core-finance
  sql:
    init:
      mode: always

arcabank:
  iban:
    country-code: "UA"
    bank-code: "305299"
  defaults:
    account-type: "CHECKING"

bank:
  integration:
    nbu:
      url: "https://bank.gov.ua/NBUStatService/v1/statdirectory"
      json: "/exchange?json"

  exchange:
    margin: 0.015
    supported-currencies: USD, EUR
    cron: "0 0 1 * * ?"