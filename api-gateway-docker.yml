spring:
  cloud:
    gateway:
      routes:
        - id: core-finance-route
          uri: http://core-service:8088
          predicates:
            - Path=/api/v1/transfers/**, /api/v1/vaults/**
        - id: auth-service-route
          uri: http://auth-service:8081
          predicates:
            - Path=/api/v1/auth/**
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://arcabank_keycloak:8080/realms/arcabank